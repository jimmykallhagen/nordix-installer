##====================================================================##
#                           Colors for Gum                            #
##====================================================================##
#                                                                      #
#

DARK_GRAY="#1c2328ee"
LIGHT1_GRAY="#4f565eaa"
LIGHT2_GRAY="#3d444daa"
TEXT_COLOR_1="#81d1f1ff"
TEXT_COLOR_2="#11d1f5ff"

G_CRYSTAL="#b3f0ff"
G_FICE="#4abecf"
G_ICE="#59d8e5"
G_CICE="#b3f0ff"
G_BLUE="#13abc6"

G_BASE_COLOR="#81d1f1"

##====================================================================##


##====================================================================##
#                             Gum  options                            #
##====================================================================##
#                                                                      #
#
# Gum align left - center - right
BOX_ALIGN="center"
G_ALIGN="center"

# Gum padding
G_PADDING="0 2"

# Gum Box style
G_BOX_STYLE="rounded"

# Gum confirm box sice
G_BOX_PADDING="1 2"

# Gum box selected/unselected "yes/no" text color
GUM_SELECTED_TEXT_COLOR="$TEXT_COLOR_2"
GUM_UNSELECTED_TEXT_COLOR="$UNSELECTED_TEXT_COLOR_1"
GUM_SELECTED_COLOR="#ffffff"

#  Header
HEADER_WIDHT=120 \
HEADER_HEIGHT=1 \

#                                                                      #
##====================================================================##


##====================================================================##
#                              Gum  Color                             #
##====================================================================##
#                                                                      #
# Confirm - Box color "$" is no color

G_SELECTED_BACKGROUND_COLOR="#4f565eaa"
G_UNSELECTED_BACKGROUND_COLOR="$"

# Gum text color
GUM_CONFIRMBOX_TEXT_COLOR="$TEXT_COLOR_1"
UNSELECTED_TEXT_COLOR_1="#81d1f1"
UNSELECTED_TEXT_COLOR_2="#11d1f5"


##====================##
 #    * GUM BOX *     #
##====================##

# Border Color
G_BORDER_COLOR="$G_BLUE"
G_BOX_TEXT_COLOR="$TEXT_COLOR_1"

##====================##
 #    * GUM SPIN *     #
##====================##

G_SPINNER="$G_BLUE"
G_SPIN_TEXT="$TEXT_COLOR_1"
#                                                                      #
##====================================================================##


##====================================================================##
#                      Confir yes/no with gum                          #
##====================================================================##
#                                                                      #
#   * Usage: <text>                                                    #
#   * Exemple: gum_confirm  "Confirm"                                  #
#                                                                      #
##====================================================================##
#                                                                      #

gum_confirm() {
    local message="$1"
    gum confirm --padding="$G_PADDING" \
\
      --selected.align="$G_ALIGN" \
      --selected.border="$G_BOX_STYLE" \
      --selected.bold \
      --selected.background="$G_SELECTED_BACKGROUND_COLOR" \
      --selected.foreground="$GUM_SELECTED_TEXT_COLOR" \
\
      --unselected.align="$G_ALIGN" \
      --unselected.border="$G_BOX_STYLE" \
      --unselected.background="$G_UNSELECTED_BACKGROUND_COLOR" \
      --unselected.foreground="$GUM_SELECTED_TEXT_COLOR" \
      --unselected.faint \
\
      --prompt.padding="$G_BOX_PADDING" \
      --prompt.align="$BOX_ALIGN" \
      --prompt.border="$G_BOX_STYLE" \
      --prompt.foreground="$GUM_CONFIRMBOX_TEXT_COLOR" "$message"
}

#                                                                      #
##====================================================================##

##====================================================================##
#                  Gum Text in box - Box text/text box                 #
##====================================================================##
#                                                                      #
#   * Usage:  <text>                                                   #
#   * Exemple: gum_box why??                                           #
#                                                                      #
##====================================================================##
#                                                                      #
# Gum text in box
gum_box() {

    gum style \
      --foreground "$G_BOX_TEXT_COLOR" \
      --border-foreground "$G_BORDER_COLOR" \
      --border="$G_BOX_STYLE" \
      --align "$G_ALIGN" \
      --margin "0 3" \
      --padding "0 1" \
      --bold  "$@"
}
##====================================================================##
#                                                                      #
#   * Usage:  <text>                                                   #
#   * Exemple: gum_box why??                                           #
#                                                                      #
##====================================================================##
#                                                                      #
# Gum text in box with sleep and clear
gum_box_sleep() {

    gum style \
      --foreground "$G_BOX_TEXT_COLOR" \
      --border-foreground "$G_BORDER_COLOR" \
      --border="$G_BOX_STYLE" \
      --align "$G_ALIGN" \
      --margin "1 2" \
      --padding "0 1" \
      --bold  "$@"

sleep 4
clear
}
#                                                                      #
##====================================================================##

##====================================================================##
#                              Gum Sipnner                            #
##====================================================================##
#                                                                      #
#   * Usage:  gum_spin <comand>                                        #
#   * Exemple: gum_spin zpool scrub tank                               #
#                                                                      #
#  line, dot, minidot, jump, pulse,                                    #
#  points, globe, moon, monkey, meter, hamburger.                      #
##====================================================================##
#                                                                      #
gum_spin() {
    gum spin \
      --padding="$G_PADDING" \
      --spinner="points" \
      --title="Working" \
      --spinner.foreground="$G_SPINNER" \
      --title.foreground="$G_SPIN_TEXT"  \
      --align "left" \
      "$@"
}

##====================================================================##
#                        Gum Sipnner Timer                            #
##====================================================================##
#                                                                      #
#   * Usage:  gum_spin_timer <time in sec> <comand>                    #
#   * Exemple: gum_spin_timer   echo 'hello'                           #
#                                                                      #
#  line, dot, minidot, jump, pulse,                                    #
#  points, globe, moon, monkey, meter, hamburger.                      #
##====================================================================##
#                                                                      #
gum_spin_timer() {
    gum spin \
      --padding="$G_PADDING" \
      --spinner="points" \
      --title="Working" \
      --spinner.foreground="$G_SPINNER" \
      --title.foreground="$G_SPIN_TEXT"  \
      --align "left" \
         --title="$@" \
         sleep 2.5
}
#                                                                      #
##====================================================================##

##====================================================================##
#                              Gum Pager                              #
##====================================================================##
#                                                                      #
#   * Usage:  gum_pager < /path/to/file                                #
#                                                                      #
##====================================================================##
#                                                                      #
gum_pager() {
     gum pager \
       --border-foreground="$G_BOX_STYLE" \
       --foreground="$G_BOX_TEXT_COLOR" \
       --border="$G_BOX_STYLE" \
       "$@"
}
#                                                                      #
##====================================================================##

##====================================================================##
#                             Gum choose                              #
##====================================================================##
#                                                                      #
#   * Usage:  cat text.txt | gum_choose <text>                         #
#                                                                      #
##====================================================================##
#                                                                      #
gum_choose() {
    gum choose \
       --header.border="$G_BOX_STYLE" \
       --header.align="center" --item.align="center" --header.width="25" --header.height="1" \
       --header.foreground="$GUM_CONFIRMBOX_TEXT_COLOR" \
--header.bold \
       --item.foreground="$LIGHT1_GRAY" \
       --cursor.foreground="$G_BOX_TEXT_COLOR2" \
       --cursor.bold --cursor="❯ " \
   --height="15" \
      --header "$@"
}

##====================================================================##
#                        Gum choose no limit                          #
##====================================================================##
#                                                                      #
#   * Usage:  cat text.txt | gum_choose_no_limit  <text>               #
#                                                                      #
##====================================================================##
#                                                                      #
gum_choose_no_limit() {
    gum choose  \
       --header.border="$G_BOX_STYLE" \
       --header.align="center" --item.align="center" --header.width=25 --header.height=1 \
       --header.border-foreground="" \
       --header.bold \
       --item.foreground="$LIGHT1_GRAY" \
       --header.foreground="$GUM_CONFIRMBOX_TEXT_COLOR" \
       --cursor.foreground="$G_BOX_TEXT_COLOR2" \
--selected.foreground="$GUM_SELECTED_COLOR" \
       --no-limit \
       --cursor.bold --cursor="❯ " \
   --height="15" \
       --header "$@"
}

# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications and session
#"Mod+Return" = { action = "spawn:alacritty", repeat = false }
#"Super + Space" = "spawn:noctalia msg panel-toggle launcher"
#"Alt+Q" = { action = "window-close", repeat = false }
"Mod+Escape" = "session-quit"
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
########################################################################
"ALT+Return"    = "spawn:alacritty"
"ALT+W"         = "spawn:firefox"
"Super+Space"   = "spawn:noctalia msg panel-toggle launcher"
"ALT+Q"         = "window-close"
"ALT+Space"     = "spawn:onagre"
"ALT+E"         = "spawn:thunar"
"ALT+Shift+E"   = "spawn:zeditor"
"Super+E"       = "spawn:emote"
########################################################################
# Media, volume and brightness keys from any input device, routed through the
# Noctalia shell so its OSDs show. Safe while the session is locked.
# https://docs.noctalia.dev/noctalia/compositor-settings/umbriel
"XF86AudioRaiseVolume" = { action = "spawn:noctalia msg volume-up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn:noctalia msg volume-down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn:noctalia msg volume-mute", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn:noctalia msg media toggle", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn:noctalia msg media next", allow_when_locked = true }
"XF86AudioPrev" = { action = "spawn:noctalia msg media previous", allow_when_locked = true }
"XF86MonBrightnessUp" = { action = "spawn:noctalia msg brightness-up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn:noctalia msg brightness-down", allow_when_locked = true }
###########################################################
"ALT+Left"      = "window-focus-left"
"ALT+Down"      = "window-focus-down"
"ALT+Up"        = "window-focus-up"
"ALT+Right"     = "window-focus-right"
"ALT+WheelUp"         = "window-focus-right"
"ALT+WheelDown"       = "window-focus-left"
"ALT+Shift+WheelUp"   = "column-move-right"
"ALT+Shift+WheelDown" = "column-move-left"
"ALT+V"         = "window-toggle-floating"
"ALT+Shift+v"   = "window-focus-switch-floating"
"Super+P"       = "window-toggle-pinned"
"Super+F"       = "window-toggle-maximize-to-edges"
"ALT+X" = { action = "overview-toggle", repeat = false }
 "Super+Escape" = "session-quit"
 "ALT+Shift+Left"  = "column-move-left"
 "ALT+Shift+Down"  = "window-move-down"
 "ALT+Shift+Up"    = "window-move-up"
 "ALT+Shift+Right" = "column-move-right"
 "Super+Shift+F"     = "window-toggle-fullscreen"           # Exit restores the previous layout size immediately
 "Super+Ctrl+F"      = "window-toggle-maximize"
 "Super+Comma"      = "window-consume-left"
 "Super+Period"     = "window-consume-right"

 "Super+UP" = "workspace-previous"
 "Super+Down" = "workspace-next"
 "Super+Shift+Up" = "window-move-to-workspace-previous"
 "Super+Shift+Down" = "window-move-to-workspace-next"
 "Super+Home" = "column-focus-first"
 "Super+End" = "column-focus-last"
 "Mod+Shift+Home" = "column-move-to-first"
 "Mod+Shift+End" = "column-move-to-last"

 "ALT+C" = "column-center"
 "ALT+Shift+C" = "window-center"
 "ALT+Ctrl+T" = "workspace-set-layout:toggle"
 "ALT+MouseMiddle" = "layout-scroll-drag"
 "Super+WheelUp" = { action = "workspace-previous", cooldown_ms = 150 }
 "Super+WheelDown" = { action = "workspace-next", cooldown_ms = 150 }
##########################################################
 "Mod+L" = { action = "submap:resize", repeat = false }
# "submap[resize],1" = { action = "window-set-width:0.5", submap = "reset" }
# "submap[resize],N" = { action = "submap:nudge", repeat = false }
# "submap[resize],Escape" = "submap:reset"
# "submap[nudge],Left" = "window-modify-width:-0.1"
# "Supersubmap[nudge],Right" = "window-modify-width:0.1"
# "submap[nudge],Escape" = "submap:reset"
 "Escape" = "submap:reset"

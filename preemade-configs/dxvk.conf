# ====================================================================
#                      NORDIX DXVK CONFIGURATION
# ====================================================================
# Global Location: ~/.config/dxvk.conf
# Per-game Location: Place inside the game's executable directory
#
# Verified against official DXVK documentation (2026)
# ====================================================================

# ====================================================================
#              FRAME LATENCY (Render Queue Control)
# ====================================================================
# Enforce a stricter maximum frame latency, overriding the game's default.
# Lower value = less input lag, but might cause stuttering if FPS fluctuates.
#
# Values:
#  0 = Use the application/game default (Recommended for global config)
#  1 = Force a 1-frame queue (Best for competitive gaming/lowest latency)
#  2 = Force a 2-frame queue (Balanced)

dxgi.maxFrameLatency = 0
d3d9.maxFrameLatency = 0
d3d10.maxFrameLatency = 0
d3d11.maxFrameLatency = 0
#
# ====================================================================
#              SHADER COMPILATION & PIPELINES
# ====================================================================
# Number of compiler threads used for background shader compilation.
#
# Values:
#  0      = Auto-detect and utilize all available CPU cores (Recommended for global config)
#  Custom = Specify a fixed number of threads (e.g., 4, 8, 12, 16)
#
# Note: Hardcoding a high value (like 16) can cause severe stuttering 
# and system lag on CPUs with fewer cores.

dxvk.numCompilerThreads = 0

# Graphics Pipeline Library (GPL)
# Controls the compilation framework to prevent shader compilation stutter.
#
# Values:
#  Auto  = Enable if supported by the graphics driver (Recommended)
#  True  = Force enable (Do not compile optimized pipelines in background)
#  False = Disable completely (Will cause severe shader stutter)

dxvk.enableGraphicsPipelineLibrary = Auto
#
# ====================================================================
#                HDR (High Dynamic Range) SUPPORT
# ====================================================================
# Expose the HDR10 ColorSpace to the application.
# Many games require this to consider exposing HDR options in their menus.
#
# Values:
#  Auto  = Follows the value of the DXVK_HDR environment variable (Recommended)
#  True  = Force enable (May cause crashes or distorted colors on SDR monitors)
#  False = Disable completely

dxgi.enableHDR = Auto

# ====================================================================
#         VSYNC & FPS LIMITATION (Presentation Modes)
# ====================================================================
# Overrides the synchronization interval (Vsync) for presentation.
#  -1 = Default behavior (Let the game control Vsync)
#   0 = Force disable vertical synchronization entirely
#  >=1 = Enable Vsync and repeat the image 'n' times

dxgi.syncInterval = -1
d3d9.presentInterval = -1

# Frame rate limiter (Limits maximum frames per second)
# NOTE: External limiters like MangoHud or Gamescope provide significantly
# better frame pacing. Use DXVK's limiter only if external tools are unavailable.
#  0 = Unlimited (Recommended default)
#  n = Limit to 'n' frames per second

dxgi.maxFrameRate = 0
d3d9.maxFrameRate = 0
dxvk.maxFrameRate = 0

# Tear-free mode (Controls presentation when Vsync is disabled)
#  Auto  = Automatic driver management (Recommended, allows Wayland tearing-control)
#  True  = Forces Mailbox mode (Eliminates tearing but can cause stutter/judder)
#  False = Forces Relaxed FIFO (Reduces stutter if FPS drops below refresh rate)

dxvk.tearFree = Auto

# ====================================================================
#              D3D9 (DIRECTX 9) SPECIFIC SETTINGS
# ====================================================================
# Override maximum amount of device memory reported to D3D9 applications.
#
# NOTE: Setting this higher than 4096 (4GB) globally is STRICTLY NOT recommended.
# Old 32-bit DX9 game engines will suffer from integer overflows, causing 
# them to report 0MB VRAM, leading to instant crashes or broken textures.
# Keep at 4096 for maximum compatibility across your distribution.

d3d9.maxAvailableMemory = 4096

# Floating point quirk emulation for older titles.
#  Auto   = DXVK automatically detects the best method per game (Recommended)
#  True   = Faster, but less accurate approach (Works for most games)
#  Strict = Slower, but mathematically correct approach (Required for some titles)

d3d9.floatEmulation = Auto

# Note: Global forcing of back buffers/triple buffering via d3d9 variables 
# is deprecated and handled automatically by DXVK's frame latency logic.
#
# ============================================
#        VRAM LIMITATION (OPTIONAL)
# ============================================

# Override maximum device/shared memory (MB)
# 0 = no limit (default, recommended)
# Set only if games have problems with large amounts of VRAM
#
dxgi.maxDeviceMemory = 0
dxgi.maxSharedMemory = 0
#
# ====================================================================
#               IMPORTANT NOTES & STEAM LAUNCH OPTIONS
# ====================================================================
# Note: Your system-wide profile (/etc/profile.d/nordix-gaming.sh) 
# already loads this config globally. You do NOT need to specify it 
# in Steam unless you want to override it.
#
# Correct Steam Launch Options Example (All on ONE line, %command% at the end):
#  DXVK_HUD=fps %command%
#
# To force a custom config file per-game via Steam:
#  DXVK_CONFIG_FILE=/home/yourusername/.config/custom-dxvk.conf %command%
#
# --------------------------------------------------------------------
# 1. State cache is ALWAYS enabled and managed automatically since DXVK 2.0+
#
# 2. Async shader compilation is DEFAULT since DXVK 2.0+ via Vulkan GPL.
#    (The old 'dxvk.enableAsync' flag is DEPRECATED and completely ignored).
#
# 3. Commented options (starting with #) use DXVK's built-in defaults.
#    Remove the '#' to uncomment and enable a custom value.
#
# 4. For per-game configuration: Place a copy of this file renamed as 
#    'dxvk.conf' directly into the game's executable directory (where the .exe is).
# ====================================================================
